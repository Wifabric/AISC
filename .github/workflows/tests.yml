name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Entrypoint tests execute Linux container shell fragments on the host.
      # They require GNU cp's update semantics, which BSD cp does not provide.
      - name: Use GNU coreutils for Linux entrypoint tests on macOS
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      # 2026-10-18 方案 B（用户裁定）：与 workbench-ci 的 Python tests
      # step 同构——pytest 统一收集 unittest 风格与 pytest 原生测试。
      - name: Run all tests
        run: python -m pytest tests -q
